name: provenance_society
description: Provenance Society. A private society for serious fragrance collectors.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  freezed_annotation: 3.1.0
  go_router: 18.1.2
  intl: 0.20.2
  json_annotation: 4.12.0
  riverpod_annotation: 4.0.7

dev_dependencies:
  build_runner: 2.15.1
  flutter_test:
    sdk: flutter
  freezed: 4.0.0-dev.3
  json_serializable: 6.15.2
  riverpod_generator: 4.0.9
  very_good_analysis: 10.3.0

flutter:
  uses-material-design: false
  generate: true
  fonts:
    # Open Font License. Variable fonts: weight (and optical size for Fraunces) are set per style.
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces.ttf
    - family: Inter Tight
      fonts:
        - asset: assets/fonts/InterTight.ttf
