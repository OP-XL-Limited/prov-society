name: admin
on:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Tokens are fresh and contrast passes (WEBD-03, DS-03)
        run: |
          npm run tokens:check
          npm run test:tokens
      - run: npm run lint --workspace provenance-admin
      - run: npm run typecheck --workspace provenance-admin
      - run: npm test --workspace provenance-admin
      - run: npm run build --workspace provenance-admin
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
